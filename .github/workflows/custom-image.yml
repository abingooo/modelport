name: Custom Image

on:
  push:
    tags:
      - "custom-v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify production release
        shell: bash
        run: |
          git fetch --no-tags origin production
          production_sha="$(git rev-parse origin/production)"
          if [[ "${GITHUB_SHA}" != "${production_sha}" ]]; then
            echo "Stable tags must point to the current production commit." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          app_version="${GITHUB_REF_NAME#custom-v}"
          if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid custom version tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          {
            echo "image=ghcr.io/${repository}"
            echo "version=${GITHUB_REF_NAME}"
            echo "app_version=${app_version}"
            echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release notes
        shell: bash
        run: |
          notes="docs/releases/${{ steps.meta.outputs.app_version }}.md"
          if [[ ! -s "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.app_version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ModelPort ${{ steps.meta.outputs.app_version }}
          make_latest: false
          generate_release_notes: true
          body_path: docs/releases/${{ steps.meta.outputs.app_version }}.md
