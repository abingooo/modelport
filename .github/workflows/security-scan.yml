name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          set -euo pipefail
          scanner_dir="${RUNNER_TEMP}/modelport-govulncheck"
          mkdir -p "${scanner_dir}"
          GOBIN="${scanner_dir}" go install \
            "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "${scanner_dir}/govulncheck" -version \
            | grep -Fqx "Scanner: govulncheck@${GOVULNCHECK_VERSION}"
          "${scanner_dir}/govulncheck" ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          set -euo pipefail
          set +e
          pnpm audit --prod --audit-level=high --json > audit.json
          audit_status=$?
          set -e
          case "${audit_status}" in
            0|1) ;;
            *)
              echo "pnpm audit failed before producing a vulnerability result" >&2
              exit "${audit_status}"
              ;;
          esac
          jq -e 'type == "object" and
            (.metadata.vulnerabilities | type == "object") and
            ((.advisories | type == "object") or
             (.vulnerabilities | type == "object"))' audit.json >/dev/null
          python3 ../tools/check_pnpm_audit_exceptions.py \
            --audit audit.json \
            --exceptions ../.github/audit-exceptions.yml
